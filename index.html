<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Advanced Number System Converter</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for crisp modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="container">
        <header>
            <div class="badge">ICT Project</div>
            <h1>Number System <span>Converter</span></h1>
            <p>Real-time bidirectional conversion across Binary, Decimal, Octal, and Hexadecimal bases.</p>
        </header>

        <main class="converter-grid">
            <!-- Binary Card -->
            <div class="card" data-base="binary">
                <div class="card-header">
                    <span class="base-tag">Base 2</span>
                    <h2>Binary</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="binary" placeholder="e.g. 1010" autocomplete="off" spellcheck="false">
                    <button class="copy-btn" onclick="copyValue('binary')" title="Copy Value">📋</button>
                </div>
                <span class="error-msg" id="binary-err"></span>
            </div>

            <!-- Decimal Card -->
            <div class="card" data-base="decimal">
                <div class="card-header">
                    <span class="base-tag">Base 10</span>
                    <h2>Decimal</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="decimal" placeholder="e.g. 10" autocomplete="off" spellcheck="false">
                    <button class="copy-btn" onclick="copyValue('decimal')" title="Copy Value">📋</button>
                </div>
                <span class="error-msg" id="decimal-err"></span>
            </div>

            <!-- Octal Card -->
            <div class="card" data-base="octal">
                <div class="card-header">
                    <span class="base-tag">Base 8</span>
                    <h2>Octal</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="octal" placeholder="e.g. 12" autocomplete="off" spellcheck="false">
                    <button class="copy-btn" onclick="copyValue('octal')" title="Copy Value">📋</button>
                </div>
                <span class="error-msg" id="octal-err"></span>
            </div>

            <!-- Hexadecimal Card -->
            <div class="card" data-base="hex">
                <div class="card-header">
                    <span class="base-tag">Base 16</span>
                    <h2>Hexadecimal</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="hex" placeholder="e.g. A" autocomplete="off" spellcheck="false">
                    <button class="copy-btn" onclick="copyValue('hex')" title="Copy Value">📋</button>
                </div>
                <span class="error-msg" id="hex-err"></span>
            </div>
        </main>

        <div class="actions-bar">
            <button id="clear-btn" onclick="clearAll()">Clear All Fields</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
